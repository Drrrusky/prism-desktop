name: Windows desktop build

on:
  push:
    branches: [windows-port-source]
  pull_request:
    branches: [windows-port-source]
  workflow_dispatch:

jobs:
  desktop-jvm:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-37
            build-tools;37.0.0

      - name: Build Windows desktop distribution
        shell: pwsh
        run: .\gradlew.bat :shared:createDistributable

      - name: Archive Windows desktop app
        shell: pwsh
        run: Compress-Archive -Path shared\build\compose\binaries\main\app\* -DestinationPath Prism-Desktop-Windows.zip -Force

      - name: Upload Windows desktop app
        uses: actions/upload-artifact@v4
        with:
          name: Prism-Desktop-Windows
          path: Prism-Desktop-Windows.zip
          if-no-files-found: error
